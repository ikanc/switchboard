name: Switchboard
options:
  bundleIdPrefix: ca.codejitsu
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  Switchboard:
    type: application
    platform: macOS
    sources:
      - path: Switchboard
        excludes:
          - Resources
    resources:
      - path: Switchboard/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Switchboard/Resources/Info.plist
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: ""
        PRODUCT_BUNDLE_IDENTIFIER: ca.codejitsu.switchboard
        PRODUCT_NAME: Switchboard
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
